<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Grana di stampa statica: rumore in scala di grigi, opacità 0.1.
       Si usa solo come strato di sfondo sotto il colore di stagione. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.4" intercept="-0.7"/>
      <feFuncG type="linear" slope="2.4" intercept="-0.7"/>
      <feFuncB type="linear" slope="2.4" intercept="-0.7"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#grain)" opacity="0.1"/>
</svg>
